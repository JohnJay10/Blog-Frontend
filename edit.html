<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog | Create a post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="nav-bar">
        <div class="nav-container">
            <a href="index.html" class="brand">Simple Blog</a>

            <nav class="nav-links" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="create.html" class="btn-primary" aria-current="page">Create post</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div class="form-card">
            <h1>Create a post</h1>
            <p class="form-intro">Share an idea, a story, or something you have learned.</p>
            <form id="edit-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" placeholder="Give your post a title" required>
                </div>

                <div class="form-group">
                    <label for="body">Your story</label>
                    <textarea name="body" id="body" rows="10" placeholder="Start writing here..." required></textarea>
                </div>

                <button type="submit">Edit post</button>
            </form>
        </div>
    </main>
    <script type="module" src="js/edit.js"></script>
</body>
</html>
