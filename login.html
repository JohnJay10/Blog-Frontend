<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Blog | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="nav-bar">
        <div class="nav-container">
            <a href="index.html" class="brand">Simple Blog</a>
            <nav class="nav-links" id="nav-links" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="register.html" class="btn-primary">Create account</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-container auth-main">
        <section class="form-card auth-card">
            <h1>Welcome back</h1>
            <p class="form-intro">Log in to continue sharing your stories.</p>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="email" name="email" id="username" placeholder="Enter your email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button type="submit">Login</button>
                <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
            </form>
        </section>
    </main>

    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/nav.js"></script>
</body>
</html>
