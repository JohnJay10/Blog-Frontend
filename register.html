<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7f4">
    <title>Join Commonplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand"><span class="brand-mark">c.</span> Commonplace</a>
            <nav id="nav-links" class="nav-links" aria-label="Main navigation">
                <ul><li><a href="index.html">Discover</a></li><li><a href="login.html" class="btn-primary">Sign in</a></li></ul>
            </nav>
        </div>
    </header>
    <main class="main-container auth-main">
        <section class="form-card auth-card">
            <p class="eyebrow">A seat at the table</p>
            <h1>Join the conversation</h1>
            <p class="form-intro">Create an account to share your perspective and connect with curious minds.</p>
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" maxlength="40" placeholder="Choose a username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" minlength="6" placeholder="At least 6 characters" autocomplete="new-password" required>
                </div>
                <p class="form-status" id="auth-status" role="status"></p>
                <button type="submit">Create account</button>
                <p class="auth-switch">Already a member? <a href="login.html">Sign in</a></p>
            </form>
        </section>
    </main>
    <script type="module" src="js/register.js"></script>
    <script type="module" src="js/nav.js"></script>
</body>
</html>
